modules:
  rovo:mcp:
    - key: hedge-mcp
      name: Hedge
      tools:
        - triage-issue
        - explain-policy
  rovo:agent:
    - key: hedge-agent
      name: Hedge
      description: >
        Checks whether a Jira issue is a duplicate or a new report, and says whether that
        call is certified inside the site's error budget or needs a person.
      icon: resource:static;icon.svg
      prompt: >
        You help people triage Jira issues with Hedge. Hedge decides for one issue whether
        it is a duplicate of an earlier issue (link), a new report that needs no duplicate
        check (clear), or one a person must decide (ask). It acts only when a calibrated
        test certifies that at most the admin's error budget of its actions are wrong.


        When the user names an issue key, call the triage-issue action with it. Report the
        decision first in one sentence, then the reason Hedge gave, then the closest earlier
        issues it listed with their keys. If the decision is ask, say plainly that a person
        should compare the issue with those closest issues, and do not guess the answer
        yourself. Never say you linked, cleared or changed an issue: the triage action only
        reports Hedge's call. Never offer your own confidence in place of Hedge's.


        If the site admin turned on acting on new issues, Hedge labels each new issue when
        it is filed: hedge-cleared for a new report, hedge-duplicate for a likely duplicate
        a person should link, and hedge-ask for one a person must decide. If the result
        lists one of these labels, say Hedge applied that call when the issue was filed.
        Searching labels = hedge-ask shows what is waiting for a person.


        When the user asks how reliable Hedge is, what the budget is, or why it asks so
        often, call the explain-policy action and repeat its guarantee in plain words.


        If an issue key is missing or malformed, ask for a key like PROJ-123. If the action
        returns an error, repeat it and say a person decides that issue.
      conversationStarters:
        - Is PROJ-123 a duplicate?
        - What error rate does Hedge promise?
        - Why does Hedge ask about some tickets?
      actions:
        - triage-issue
        - explain-policy
  action:
    - key: triage-issue
      name: Triage issue
      function: triage-fn
      actionVerb: GET
      description: >
        Decide whether an agent may act on a Jira issue (call it a duplicate, or clear it as
        new) or must ask a person. Returns the decision, score, calibrated threshold and a
        plain reason. It only reports the call and changes nothing.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PROJ-123
    - key: explain-policy
      name: Explain policy
      function: explain-fn
      actionVerb: GET
      description: >
        Describe the error-rate guarantee of the installed act-or-ask policy: the error
        budget, the confidence level and the calibration set size.
  jira:issuePanel:
    - key: hedge-panel
      title: Hedge
      icon: resource:static;icon.svg
      resource: panel
      resolver:
        function: resolver-fn
      render: native
  jira:projectPage:
    - key: hedge-queue
      title: Hedge queue
      icon: resource:static;icon.svg
      resource: queue
      resolver:
        function: resolver-fn
      render: native
  jira:adminPage:
    - key: hedge-admin
      title: Hedge error budget
      resource: admin
      resolver:
        function: resolver-fn
      render: native
  trigger:
    - key: hedge-created
      function: created-fn
      events:
        - avi:jira:created:issue
  function:
    - key: created-fn
      handler: index.issueCreated
    - key: resolver-fn
      handler: resolver.handler
    - key: triage-fn
      handler: index.triageIssue
    - key: explain-fn
      handler: index.explainPolicy
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: queue
    path: src/frontend/queue.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: static
    path: static
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/cc9d2e28-70ff-497d-858a-f24fa97e2118
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
